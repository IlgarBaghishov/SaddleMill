# DoubleMinimization under the production hard rules (2026-08-31):
#   * Calculator = VaspInteractive  (one persistent VASP process per side; the
#     nsw trap: nsw must be large or VI silently degrades to a single-point)
#   * Optimizer  = FIRE + the [FIRE] champion block (HPO round-2 winner);
#     ASE bare LBFGS is banned (no curvature guard, can converge onto saddles)
#   * isym = 0   fleet-wide, set explicitly, never left to a calculator default
#   * kill_timeout = 900  (default 60 truncates OUTCAR teardown on big cells)
#   * input_statuses = all  ("converged" silently skips frames)
#   * resume_partial = True on production fleets (banks optimization_*.traj at
#     restart and resumes each side mid-run; keep False on HPO arms, where it
#     under-reports n_force_calls)
# Gate every submit with tools/preflight_new_shard.py && sbatch.
# Split: OC22 -- input_generator = oc22; the hardest-converging split. The two
# extra [Vasp] knobs are the measured oc22 convergence tweaks:
#   algo = Normal  (blocked Davidson rescues poisoned SCF where RMM-DIIS never
#                   does, p=1.6e-5; ALGO=All is FORBIDDEN on oc22 slabs -- it
#                   OOMs ~100-atom cells at ~77 GB/node)
#   nelm = 100     (headroom for slab SCF)
# Slab-mix (AMIX=0.2/BMIX=1e-5/AMIX_MAG=0.8/BMIX_MAG=1e-5) is NOT included
# here: it is under evaluation and suspected to harm smaller cells; add it
# only for known charge-sloshing cases.
# Cluster: anvil (Purdue, current oc22 production venue). 128-core nodes;
# 2 sides/node x 64 ranks; ncore=32.

[Main]
executorlib = True
method = DoubleMinimization
dir_path = data
device = 'cpu'
Calculator = VaspInteractive
Optimizer = FIRE
fmax = 0.02
steps = 600
zip = True
max_consecutive_errors = 0
jobs_per_node = 2
continue_from_result = True
run_jobs = errored not_converged remaining
input_statuses = all

[Vasp]
ibrion = -1
nsw = 2000
isym = 0
kill_timeout = 900
lreal = false
ediff = 1e-5
lcharg = False
lwave = True
lvtot = False
pp = PBE
pp_version = 54
ncore = 32
kpar = 1
algo = Normal
nelm = 100

[FIRE]
dt = 0.1
maxstep = 0.2
dtmax = 1.0
downhill_check = False

[ourVasp]
input_generator = oc22

[ourDoubleMinimization]
resume_partial = True
relax_cell = False
pre_dimer_refine = False
vasp_command = "OMP_NUM_THREADS=1 /apps/spack/anvil/apps/openmpi/4.0.6-intel-19.0.5-gg3uqqz/bin/mpirun --bind-to none -n 64 vasp_std"
vasp_ncore = 32
